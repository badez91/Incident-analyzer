server:
  port: 8084

spring:
  application:
    name: knowledge-store-service
  datasource:
    url: jdbc:postgresql://localhost:5432/engineering_intelligence
    username: faizfarhan
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
