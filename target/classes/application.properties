server.port=8080

# Ollama configuration
ollama.url=http://localhost:11434/api/generate
ollama.model=qwen3:1.7b
ollama.models=qwen3:1.7b,qwen3:8b
ollama.timeout-seconds=300

# File upload limits
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/incident_knowledge
spring.datasource.username=faizfarhan
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=10

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Grafana / Loki configuration (HIATUS - pending service account token access)
# Approach A: Grafana Webhook (push) - no token needed, Grafana alerts push to app
# Approach C: Grafana Export (on-demand) - user exports JSON from Grafana Explore UI
grafana.url=https://cmctos.grafana.net
grafana.service-account-token=
grafana.loki.datasource-uid=grafanacloud-logs
grafana.loki.timeout-seconds=60
grafana.loki.default-limit=5000
