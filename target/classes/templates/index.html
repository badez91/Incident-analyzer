<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Log Analyzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px;
            max-width: 520px;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #1a1a2e;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input[type="file"] {
            border: 2px dashed #d0d7de;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        input[type="file"]:hover {
            border-color: #0969da;
        }
        button {
            background: #0969da;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0550ae; }
        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .loading {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            margin-top: 16px;
            color: #1e40af;
            font-weight: 500;
        }
        .loading.active {
            display: flex;
        }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #bfdbfe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Log Analyzer</h1>
        <p class="subtitle">Upload a .log file to extract exceptions and get AI-powered analysis.</p>

        <div th:if="${error}" class="error" th:text="${error}"></div>

        <form id="uploadForm" action="/analyze" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".log" required>

            <label for="model" style="font-weight:500; color:#475569; font-size:0.9rem;">Ollama Model</label>
            <select id="model" name="model" style="padding:10px 14px; border:1px solid #d0d7de; border-radius:8px; font-size:0.95rem; background:#fff;">
                <option th:each="m : ${models}" th:value="${m}" th:text="${m}" th:selected="${m == defaultModel}"></option>
            </select>

            <button id="submitBtn" type="submit">Analyze Log</button>
        </form>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Analyzing log file... This may take 1-2 minutes while Ollama processes the data.</span>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function() {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').textContent = 'Analyzing...';
            document.getElementById('loading').classList.add('active');
        });
    </script>
</body>
</html>
