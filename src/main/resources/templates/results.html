<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results - AI Log Analyzer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 4px;
            color: #1a1a2e;
        }
        .filename {
            color: #666;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 28px;
            margin-bottom: 20px;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 1.1rem;
            color: #1a1a2e;
        }

        /* Severity badges */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .badge-critical { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-high { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }
        .badge-medium { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .badge-low { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

        /* Summary banner */
        .summary-banner {
            background: #f8fafc;
            border-left: 4px solid #0969da;
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #1e293b;
        }

        /* Confidence meter */
        .confidence-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .confidence-bar {
            flex: 1;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            max-width: 200px;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 4px;
            background: #2563eb;
        }
        .confidence-text {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Root cause */
        .root-cause-text {
            line-height: 1.7;
            color: #374151;
        }

        /* Impact list */
        .impact-list {
            list-style: none;
            padding: 0;
        }
        .impact-list li {
            padding: 8px 0 8px 24px;
            position: relative;
            color: #374151;
            border-bottom: 1px solid #f1f5f9;
        }
        .impact-list li:last-child { border-bottom: none; }
        .impact-list li::before {
            content: "•";
            position: absolute;
            left: 8px;
            color: #ef4444;
            font-weight: bold;
        }

        /* Actions */
        .actions-group { margin-bottom: 16px; }
        .actions-group:last-child { margin-bottom: 0; }
        .actions-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .actions-label-immediate { color: #dc2626; }
        .actions-label-short { color: #d97706; }
        .actions-label-long { color: #2563eb; }
        .actions-list {
            list-style: none;
            padding: 0;
        }
        .actions-list li {
            padding: 6px 0 6px 20px;
            position: relative;
            color: #374151;
            font-size: 0.93rem;
        }
        .actions-list li::before {
            content: "→";
            position: absolute;
            left: 4px;
            color: #94a3b8;
        }

        /* Exception table */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px 14px;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        td:last-child {
            text-align: right;
            font-weight: 600;
            color: #dc2626;
        }

        /* Error/fallback */
        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 16px 20px;
            border-radius: 8px;
        }
        .raw-response {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 0.9rem;
            color: #374151;
        }

        .model-tag {
            font-size: 0.8rem;
            color: #64748b;
            background: #f1f5f9;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analysis Results</h1>
        <p class="filename">File: <span th:text="${result.filename}"></span> &nbsp; <span class="model-tag" th:text="'Model: ' + ${selectedModel}"></span></p>

        <!-- AI Analysis: Structured view -->
        <div th:if="${aiAnalysis.isStructured()}">

            <!-- Summary banner -->
            <div class="summary-banner" th:if="${aiAnalysis.summary}" th:text="${aiAnalysis.summary}"></div>

            <!-- Severity + Confidence card -->
            <div class="card">
                <div class="card-header">
                    <h2>Incident Overview</h2>
                    <span class="badge"
                          th:classappend="${aiAnalysis.severity?.toUpperCase() == 'CRITICAL'} ? 'badge-critical' : (${aiAnalysis.severity?.toUpperCase() == 'HIGH'} ? 'badge-high' : (${aiAnalysis.severity?.toUpperCase() == 'MEDIUM'} ? 'badge-medium' : 'badge-low'))"
                          th:text="${aiAnalysis.severity}"></span>
                </div>
                <div class="confidence-row">
                    <span class="confidence-text" th:text="'Confidence: ' + ${aiAnalysis.confidence} + ' (' + ${aiAnalysis.confidencePercent} + '%)'"></span>
                    <div class="confidence-bar">
                        <div class="confidence-fill" th:style="'width:' + ${aiAnalysis.confidencePercent} + '%'"></div>
                    </div>
                </div>
            </div>

            <!-- Root Cause card -->
            <div class="card">
                <h2>Root Cause</h2>
                <p class="root-cause-text" style="margin-top:12px" th:text="${aiAnalysis.rootCause}"></p>
            </div>

            <!-- Business Impact card -->
            <div class="card" th:if="${aiAnalysis.businessImpact != null and !aiAnalysis.businessImpact.isEmpty()}">
                <h2>Business Impact</h2>
                <ul class="impact-list" style="margin-top:12px">
                    <li th:each="impact : ${aiAnalysis.businessImpact}" th:text="${impact}"></li>
                </ul>
            </div>

            <!-- Recommended Actions card -->
            <div class="card" th:if="${aiAnalysis.recommendedActions != null}">
                <h2>Recommended Actions</h2>
                <div style="margin-top:16px">
                    <div class="actions-group" th:if="${aiAnalysis.recommendedActions.immediate != null and !aiAnalysis.recommendedActions.immediate.isEmpty()}">
                        <div class="actions-label actions-label-immediate">&#128293; Immediate</div>
                        <ul class="actions-list">
                            <li th:each="action : ${aiAnalysis.recommendedActions.immediate}" th:text="${action}"></li>
                        </ul>
                    </div>
                    <div class="actions-group" th:if="${aiAnalysis.recommendedActions.shortTerm != null and !aiAnalysis.recommendedActions.shortTerm.isEmpty()}">
                        <div class="actions-label actions-label-short">&#128203; Short-term</div>
                        <ul class="actions-list">
                            <li th:each="action : ${aiAnalysis.recommendedActions.shortTerm}" th:text="${action}"></li>
                        </ul>
                    </div>
                    <div class="actions-group" th:if="${aiAnalysis.recommendedActions.longTerm != null and !aiAnalysis.recommendedActions.longTerm.isEmpty()}">
                        <div class="actions-label actions-label-long">&#127959; Long-term</div>
                        <ul class="actions-list">
                            <li th:each="action : ${aiAnalysis.recommendedActions.longTerm}" th:text="${action}"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fallback: raw text response -->
        <div th:if="${aiAnalysis.isRawFallback()}" class="card">
            <h2>AI Analysis</h2>
            <div class="raw-response" style="margin-top:12px" th:text="${aiAnalysis.rawResponse}"></div>
        </div>

        <!-- Error state -->
        <div th:if="${aiAnalysis.isError()}" class="card">
            <div class="error-box" th:text="${aiAnalysis.errorMessage}"></div>
        </div>

        <!-- Exception Counts table -->
        <div class="card">
            <h2>Exception Counts</h2>
            <table style="margin-top:12px">
                <thead>
                    <tr>
                        <th>Exception</th>
                        <th>Count</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${result.exceptionCounts}">
                        <td th:text="${entry.key}"></td>
                        <td th:text="${entry.value}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="/" class="back-link">&larr; Analyze another log</a>
    </div>
</body>
</html>
